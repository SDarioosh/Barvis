# Barvis: production override for docker-compose.yml (docs/barvis/deploy.md).
# Copy to docker-compose.override.yml in the checkout; Compose merges it automatically.
# Keep everything else in .env (APP_BIND, APP_PORT, ...), not here: Compose adds list
# entries such as ports to the base file's instead of replacing them.
services:
  odysseus:
    # Run the locally built Barvis image. Without this, Compose pulls upstream's
    # ghcr.io/odysseus-dev/odysseus image and runs plain Odysseus.
    image: barvis:${BARVIS_TAG:-current}
    pull_policy: never
    environment:
      # Module MCP servers whose readOnlyHint tools run without approval
      # (src/mcp_trust.py). Comma separated, e.g. convo,<next module>.
      - ODYSSEUS_TRUSTED_READONLY_MCP=convo
