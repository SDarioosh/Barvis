# Fork: production override for docker-compose.yml (docs/fork/deploy.md).
# Copy to docker-compose.override.yml in the checkout; Compose merges it automatically.
# Keep everything else in .env (APP_BIND, APP_PORT, ...), not here: Compose adds list
# entries such as ports to the base file's instead of replacing them.
services:
  odysseus:
    # Run the locally built fork image (scripts/fork_deploy.sh). Without this, Compose
    # pulls upstream's ghcr.io/odysseus-dev/odysseus image and runs plain Odysseus.
    image: odysseus-fork:${FORK_TAG:-current}
    pull_policy: never
    environment:
      # Module MCP servers whose readOnlyHint tools run without approval
      # (src/mcp_trust.py). Comma separated, e.g. convo,<next module>.
      - ODYSSEUS_TRUSTED_READONLY_MCP=convo
      # "Record a call" (src/call_recorder.py): odysseus-sound's ingest API and token,
      # read from the checkout's .env; empty = the page says it isn't set up.
      - SOUND_MODULE_API_URL=${SOUND_MODULE_API_URL:-}
      - SOUND_MODULE_INGEST_TOKEN=${SOUND_MODULE_INGEST_TOKEN:-}
