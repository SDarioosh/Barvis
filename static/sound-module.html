<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversations — Odysseus</title>
  <meta name="theme-color" content="#282c34">
  <link rel="icon" href="/static/icon.ico">
  <script nonce="{{CSP_NONCE}}">
  // Fork: apply the theme the owner picked in Odysseus (saved in localStorage
  // as 'odysseus-theme'), like the early script in index.html and login.html.
  // theme.js isn't imported: it boots the whole settings UI.
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('odysseus-theme'));
      var s = document.documentElement.style;
      if (t && t.colors) {
        var c = t.colors;
        s.setProperty('--bg', c.bg);
        s.setProperty('--fg', c.fg);
        s.setProperty('--panel', c.panel);
        s.setProperty('--border', c.border);
        if (c.red) s.setProperty('--red', c.red);
        var a = c.advanced || {};
        if (a.inputBg) s.setProperty('--input-bg', a.inputBg);
        if (a.inputBorder) s.setProperty('--input-border', a.inputBorder);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && c.bg) m.setAttribute('content', c.bg);
      }
      // Same names as FONT_MAP in static/js/theme.js; unknown fonts keep the default.
      var fonts = {
        mono: "'Fira Code', monospace",
        sans: "system-ui, -apple-system, 'Segoe UI', sans-serif",
        serif: "Georgia, 'Times New Roman', serif",
        opendyslexic: "'OpenDyslexic', sans-serif"
      };
      if (t && t.font && fonts[t.font]) s.setProperty('--font-family', fonts[t.font]);
      if (t && t.density && t.density !== 'comfortable') {
        document.documentElement.classList.add('density-' + t.density);
      }
    } catch (e) { /* no saved theme: keep the defaults */ }
  })();
  </script>
  <link rel="stylesheet" href="/static/css/00-tokens.css?v=20260929csssplit">
  <style>
    /* Fork: odysseus-sound page. Colors, font and spacing come from the Odysseus
       tokens in 00-tokens.css plus the saved theme applied above; nothing here
       introduces new color values. */
    /* 00-tokens.css gives html and body the app's fixed, non-scrolling layout
       (height 100%, overflow hidden, overscroll-behavior none). This page scrolls the
       window instead: html and body grow with the content and are not scroll boxes,
       so no element with overscroll-behavior: none can swallow a scroll (it did on
       a Mac trackpad in Chromium browsers). */
    html, body { height: auto; overflow: visible; overscroll-behavior: auto; }
    body { background: var(--bg); color: var(--fg); margin: 0; display: block;
           min-height: 100vh;
           font-family: var(--font-family, 'Fira Code', monospace); }
    .bs-wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
    .bs-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .bs-top h1 { font-size: 1.1rem; font-weight: 600; margin: 0; flex: 1; }
    .bs-top a { color: var(--fg); opacity: 0.7; text-decoration: none; }
    .bs-top a:hover { opacity: 1; }
    .bs-section { margin: 18px 0 8px; font-size: 0.85rem; text-transform: uppercase;
                  letter-spacing: 0.06em; opacity: 0.6; }
    .bs-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
               padding: 12px 14px; margin-bottom: 10px; }
    .bs-card h2 { font-size: 0.95rem; margin: 0 0 4px; font-weight: 600; }
    .bs-meta { font-size: 0.8rem; opacity: 0.65; }
    .bs-summary { margin: 6px 0 0; font-size: 0.88rem; line-height: 1.45; }
    .bs-quote { display: block; margin: 6px 0; padding: 4px 8px; border-left: 2px solid var(--border);
                color: var(--fg); text-decoration: none; font-size: 0.86rem; }
    .bs-quote:hover { border-left-color: var(--red); }
    .bs-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .bs-input { background: var(--input-bg, var(--bg)); color: var(--fg);
                border: 1px solid var(--input-border, var(--border));
                border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 0.85rem;
                min-width: 0; }
    .bs-btn { background: transparent; color: var(--fg); border: 1px solid var(--border);
              border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 0.85rem;
              cursor: pointer; }
    .bs-btn:hover { border-color: var(--fg); }
    .bs-btn.primary { border-color: var(--red); color: var(--red); }
    .bs-btn:disabled { opacity: 0.4; cursor: default; }
    .bs-filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; }
    .bs-empty, .bs-status { font-size: 0.85rem; opacity: 0.7; padding: 6px 0; }
    .bs-status.error { color: var(--red); opacity: 1; }
    .bs-link { color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
    .bs-btn, .bs-link { min-height: 36px; box-sizing: border-box; }
    .bs-link { padding: 0 2px; }
    a.bs-btn { display: inline-flex; align-items: center; text-decoration: none; }
    /* reader: one conversation, its detail and transcript (#c=<id>) */
    .bs-reader-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .bs-reader-top h2 { font-size: 1rem; margin: 0; font-weight: 600; flex: 1 1 200px; min-width: 0;
                        overflow-wrap: anywhere; }
    .bs-list { margin: 6px 0 0; padding-left: 20px; font-size: 0.88rem; line-height: 1.45; }
    .bs-list li { margin: 3px 0; }
    .bs-small { font-size: 0.78rem; opacity: 0.7; color: var(--fg); margin-left: 4px; white-space: nowrap; }
    .bs-small:hover { opacity: 1; }
    .bs-sub { margin: 12px 0 2px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
              opacity: 0.6; }
    .bs-lines { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
                padding: 4px 0; }
    .bs-line { display: grid; grid-template-columns: 4.6em 9em 1fr; gap: 8px; padding: 6px 12px;
               font-size: 0.88rem; line-height: 1.45; align-items: baseline; }
    .bs-line + .bs-line { border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
    .bs-time { font-size: 0.78rem; opacity: 0.6; color: var(--fg); text-decoration: none;
               font-variant-numeric: tabular-nums; }
    .bs-time:hover { opacity: 1; text-decoration: underline; }
    .bs-spk { background: none; border: none; padding: 0; font: inherit; font-weight: 600;
              color: var(--fg); cursor: pointer; text-align: left; overflow-wrap: anywhere;
              text-decoration: underline dotted; text-underline-offset: 3px; min-height: 28px; }
    .bs-spk:hover, .bs-spk[aria-expanded="true"] { color: var(--red); }
    .bs-text { overflow-wrap: anywhere; }
    .bs-lines > .bs-status { padding: 6px 12px; }
    .bs-edit { grid-column: 1 / -1; background: var(--bg); border: 1px solid var(--border);
               border-radius: 6px; padding: 8px 10px; margin-top: 4px; }
    .bs-edit .bs-input { flex: 1 1 160px; min-height: 36px; }
    .bs-notice { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--red);
                 border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 0.86rem; }
    @media (max-width: 640px) {
      .bs-filters { grid-template-columns: 1fr 1fr; }
      .bs-line { grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 12px; }
      .bs-line .bs-text { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="bs-wrap">
    <div class="bs-top">
      <a href="/" title="Back to Odysseus">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1>Conversations</h1>
      <button type="button" class="bs-btn" id="bs-refresh">Refresh</button>
    </div>

    <div id="bs-home">
    <div class="bs-section" id="bs-who-title">Who is this?</div>
    <div id="bs-who"><div class="bs-status">Loading…</div></div>

    <div class="bs-section">Action items</div>
    <div id="bs-items"><div class="bs-status">Loading…</div></div>

    <div class="bs-section">Recorded conversations</div>
    <form class="bs-filters" id="bs-filter">
      <input class="bs-input" name="query" placeholder="Words" aria-label="Words">
      <input class="bs-input" name="person" placeholder="Person" aria-label="Person">
      <input class="bs-input" name="since" type="date" aria-label="From">
      <input class="bs-input" name="until" type="date" aria-label="To">
      <select class="bs-input" name="kind" aria-label="Type">
        <option value="">All recordings</option>
        <option value="conversation">Conversations</option>
        <option value="note">Voice notes</option>
      </select>
      <button type="submit" class="bs-btn">Search</button>
    </form>
    <div id="bs-list"><div class="bs-status">Loading…</div></div>
    </div>

    <div id="bs-reader" hidden></div>
  </div>
  <script type="module" src="/static/js/soundModule.js"></script>
</body>
</html>
